<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Reports</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><h1>Reports</h1><form class="card" method="get"><div class="grid"><label>From<input type="date" name="from" th:value="${from}"></label><label>To<input type="date" name="to" th:value="${to}"></label><label>Dentist<select name="dentistId"><option value="">All dentists</option><option th:each="d:${dentists}" th:value="${d.id}" th:text="${d.name}"></option></select></label><label>Status<select name="status"><option value="">All statuses</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select></label></div><button>Run report</button></form><section class="card"><h2 th:text="|Revenue: LKR ${#numbers.formatDecimal(revenue,1,'COMMA',2,'POINT')}|">Revenue: LKR 0.00</h2><div class="table-wrap"><table><thead><tr><th>Date/time</th><th>Number</th><th>Patient</th><th>Dentist</th><th>Status</th></tr></thead><tbody><tr th:each="a:${appointments}"><td th:text="|${a.appointmentDate} ${a.appointmentTime}|"></td><td th:text="${a.appointmentNumber}"></td><td th:text="${a.patient.name}"></td><td th:text="${a.dentist.name}"></td><td th:text="${a.status}"></td></tr></tbody></table></div></section></main></body></html>
