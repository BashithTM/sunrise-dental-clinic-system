<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Appointment</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><section class="card"><p class="alert" th:if="${success}" th:text="${success}"></p><h1 th:text="${appointment.appointmentNumber}"></h1><dl><dt>Patient</dt><dd th:text="${appointment.patient.name}"></dd><dt>Dentist</dt><dd th:text="|${appointment.dentist.name} — ${appointment.dentist.specialization}|"></dd><dt>Treatment</dt><dd th:text="${appointment.treatment.treatmentName}"></dd><dt>Date and time</dt><dd th:text="|${appointment.appointmentDate} ${appointment.appointmentTime}|"></dd><dt>Status</dt><dd class="status" th:text="${appointment.status}"></dd><dt>Notes</dt><dd th:text="${appointment.notes?:'—'}"></dd></dl><div class="actions" th:if="${appointment.status.name()=='SCHEDULED'}"><a class="button secondary" th:href="@{/appointments/{id}/edit(id=${appointment.id})}">Reschedule</a><form th:action="@{/appointments/{id}/complete(id=${appointment.id})}" method="post"><button>Mark completed</button></form><form th:action="@{/appointments/{id}/cancel(id=${appointment.id})}" method="post"><button class="danger">Cancel</button></form></div><a class="button" th:href="@{/bills/new(appointmentNumber=${appointment.appointmentNumber})}">Generate bill</a></section></main></body></html>
