<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Appointment form</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><section class="card"><h1 th:text="${appointment==null?'Register appointment':'Reschedule appointment'}"></h1><form th:object="${appointmentRequest}" th:action="${appointment==null}?@{/appointments}:@{/appointments/{id}(id=${appointment.id})}" method="post"><label>Patient</label><select th:field="*{patientId}" required><option value="">Select patient</option><option th:each="p:${patients}" th:value="${p.id}" th:text="|${p.name} — ${p.contactNumber}|"></option></select><span class="error" th:errors="*{patientId}"></span><p><a th:href="@{/patients/new}">Register a new patient</a></p><label>Dentist</label><select th:field="*{dentistId}" required><option value="">Select dentist</option><option th:each="d:${dentists}" th:value="${d.id}" th:text="|${d.name} — ${d.specialization}|"></option></select><label>Treatment</label><select th:field="*{treatmentId}" required><option value="">Select treatment</option><option th:each="t:${treatments}" th:value="${t.id}" th:text="|${t.treatmentName} — LKR ${t.treatmentCost}|"></option></select><label>Date</label><input type="date" th:field="*{appointmentDate}" required><span class="error" th:errors="*{appointmentDate}"></span><label>Time</label><input type="time" th:field="*{appointmentTime}" required><label>Notes (optional)</label><textarea th:field="*{notes}"></textarea><button>Save appointment</button></form></section></main></body></html>
