<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Appointments</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><h1>Appointments</h1><a class="button" th:href="@{/appointments/new}">Register appointment</a><form class="card" method="get"><label>Appointment number</label><input name="number" th:value="${number}"><button>Search</button></form><div class="table-wrap"><table><thead><tr><th>Number</th><th>Date & time</th><th>Patient</th><th>Dentist</th><th>Status</th></tr></thead><tbody><tr th:each="a:${appointments}"><td><a th:href="@{/appointments/{id}(id=${a.id})}" th:text="${a.appointmentNumber}"></a></td><td th:text="|${a.appointmentDate} ${a.appointmentTime}|"></td><td th:text="${a.patient.name}"></td><td th:text="${a.dentist.name}"></td><td th:text="${a.status}"></td></tr></tbody></table></div></main></body></html>
