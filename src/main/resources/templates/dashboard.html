<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Dashboard</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><h1>Clinic dashboard</h1><div class="grid"><section class="card"><div class="metric" th:text="${summary.todayAppointments}">0</div>Today’s appointments</section><section class="card"><div class="metric" th:text="${summary.upcomingAppointments}">0</div>Upcoming</section><section class="card"><div class="metric" th:text="${summary.totalPatients}">0</div>Patients</section><section class="card"><div class="metric" th:text="${summary.totalDentists}">0</div>Dentists</section><section class="card"><div class="metric" th:text="${#numbers.formatDecimal(summary.dailyRevenue,1,2)}">0.00</div>Daily revenue (LKR)</section></div><section class="card"><h2>Today</h2><div class="table-wrap"><table><thead><tr><th>Time</th><th>Number</th><th>Patient</th><th>Dentist</th><th>Status</th></tr></thead><tbody><tr th:each="a:${today}"><td th:text="${a.appointmentTime}"></td><td><a th:href="@{/appointments/{id}(id=${a.id})}" th:text="${a.appointmentNumber}"></a></td><td th:text="${a.patient.name}"></td><td th:text="${a.dentist.name}"></td><td th:text="${a.status}"></td></tr></tbody></table></div></section></main></body></html>
