<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Receipt</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><section class="card receipt"><h1>Sunrise Dental Clinic</h1><p>Colombo, Sri Lanka</p><h2>Receipt <span th:text="${bill.billNumber}"></span></h2><p th:text="|Issued: ${#temporals.format(bill.createdAt,'yyyy-MM-dd HH:mm')}|"></p><hr><p><strong>Appointment:</strong> <span th:text="${bill.appointment.appointmentNumber}"></span></p><p><strong>Patient:</strong> <span th:text="${bill.appointment.patient.name}"></span></p><p><strong>Dentist:</strong> <span th:text="${bill.appointment.dentist.name}"></span></p><p><strong>Treatment:</strong> <span th:text="${bill.appointment.treatment.treatmentName}"></span></p><table><tr><th>Treatment cost</th><td th:text="|LKR ${#numbers.formatDecimal(bill.treatmentCost,1,2)}|"></td></tr><tr><th>Consultation fee</th><td th:text="|LKR ${#numbers.formatDecimal(bill.consultationFee,1,2)}|"></td></tr><tr><th>Total</th><td><strong th:text="|LKR ${#numbers.formatDecimal(bill.totalAmount,1,2)}|"></strong></td></tr></table><p>Thank you for choosing Sunrise Dental Clinic.</p></section><button class="no-print" onclick="window.print()">Print receipt</button></main></body></html>
