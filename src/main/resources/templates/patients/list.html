<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patients | Sunrise Dental Clinic</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><div class="dashboard-heading"><div><span class="eyebrow" style="color:var(--blue)">PATIENT MANAGEMENT</span><h1>Patient records</h1><p class="page-subtitle">Find and manage registered clinic patients.</p></div><a class="button" th:href="@{/patients/new}">＋ Register patient</a></div><p class="alert" th:if="${success}" th:text="${success}"></p><p class="patient-error" th:if="${error}" th:text="${error}"></p><section class="card search-panel"><form method="get"><label for="q">Search patients</label><div class="search-row"><input id="q" name="q" th:value="${q}" placeholder="Enter patient name, ID, or contact number"><button type="submit">Search</button><a class="button secondary" th:if="${q!=null and !q.isBlank()}" th:href="@{/patients}">Clear</a></div></form></section><section class="card"><div class="section-head"><div><h2>All patients</h2><p class="page-subtitle" th:text="|${#lists.size(patients)} record(s) found|"></p></div></div><div class="table-wrap" th:if="${!#lists.isEmpty(patients)}"><table><thead><tr><th>Patient ID</th><th>Patient name</th><th>Contact number</th><th>Address</th><th>Appointments</th><th>Actions</th></tr></thead><tbody><tr th:each="p:${patients}"><td><span class="patient-id" th:text="|#${p.id}|"></span></td><td><strong th:text="${p.name}"></strong></td><td th:text="${p.contactNumber}"></td><td class="address-cell" th:text="${p.address}"></td><td><span class="count-badge" th:text="${p.appointmentCount}"></span></td><td><div class="actions"><a class="button action-view" th:href="@{/patients/{id}(id=${p.id})}">View</a><a class="button secondary" th:href="@{/patients/{id}/edit(id=${p.id})}">Edit</a><form th:action="@{/patients/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Delete this patient? This action cannot be undone.');"><button class="danger" type="submit">Delete</button></form></div></td></tr></tbody></table></div><div class="empty-state" th:if="${#lists.isEmpty(patients)}"><div class="empty-icon">♙</div><h3 th:text="${q!=null and !q.isBlank()?'No matching patients':'No patients registered'}"></h3><p th:text="${q!=null and !q.isBlank()?'Try another name, ID, or contact number.':'Register the first patient to begin managing clinic records.'}"></p><a class="button" th:if="${q==null or q.isBlank()}" th:href="@{/patients/new}">Register patient</a></div></section></main></body></html>
