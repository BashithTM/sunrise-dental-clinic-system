<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Patients</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><h1>Patients</h1><a class="button" th:href="@{/patients/new}">Register patient</a><form class="card" method="get"><label for="q">Search name or contact number</label><input id="q" name="q" th:value="${q}"><button>Search</button></form><div class="table-wrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Address</th><th></th></tr></thead><tbody><tr th:each="p:${patients}"><td th:text="${p.name}"></td><td th:text="${p.contactNumber}"></td><td th:text="${p.address}"></td><td><a th:href="@{/patients/{id}(id=${p.id})}">View</a></td></tr></tbody></table></div></main></body></html>
