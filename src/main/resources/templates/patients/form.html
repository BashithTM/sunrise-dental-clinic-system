<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Patient form</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><section class="card"><h1 th:text="${patient==null?'Register patient':'Edit patient'}"></h1><form th:object="${patientRequest}" th:action="${patient==null}?@{/patients}:@{/patients/{id}(id=${patient.id})}" method="post"><label for="name">Full name</label><input id="name" th:field="*{name}" required><span class="error" th:errors="*{name}"></span><label for="address">Address</label><textarea id="address" th:field="*{address}" required></textarea><span class="error" th:errors="*{address}"></span><label for="contactNumber">Contact number</label><input id="contactNumber" th:field="*{contactNumber}" required><span class="error" th:errors="*{contactNumber}"></span><button>Save patient</button></form></section></main></body></html>
