<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Treatments</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><h1>Treatments</h1><a class="button" th:href="@{/treatments/new}">Add treatment</a><div class="table-wrap"><table><thead><tr><th>Treatment</th><th>Cost (LKR)</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="t:${treatments}"><td th:text="${t.treatmentName}"></td><td th:text="${#numbers.formatDecimal(t.treatmentCost,1,2)}"></td><td th:text="${t.active?'Active':'Inactive'}"></td><td class="actions"><a class="button secondary" th:href="@{/treatments/{id}/edit(id=${t.id})}">Edit</a><form th:action="@{/treatments/{id}/toggle(id=${t.id})}" method="post"><button th:text="${t.active?'Deactivate':'Activate'}"></button></form></td></tr></tbody></table></div></main></body></html>
