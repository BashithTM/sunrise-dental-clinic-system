<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Treatment form</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main><section class="card"><h1 th:text="${treatment==null?'Add treatment':'Edit treatment'}"></h1><form th:object="${treatmentRequest}" th:action="${treatment==null}?@{/treatments}:@{/treatments/{id}(id=${treatment.id})}" method="post"><label>Treatment name</label><input th:field="*{treatmentName}" required><span class="error" th:errors="*{treatmentName}"></span><label>Cost (LKR)</label><input type="number" min="0" step="0.01" th:field="*{treatmentCost}" required><span class="error" th:errors="*{treatmentCost}"></span><button>Save treatment</button></form></section></main></body></html>
