<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Staff Login</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="login"><section class="card"><h1>Sunrise Dental Clinic</h1><p>Staff sign in</p><p class="error" th:if="${param.error}">Invalid username or password.</p><p class="alert" th:if="${param.logout}">You have signed out securely.</p><form th:action="@{/login}" method="post"><label for="username">Username</label><input id="username" name="username" required autofocus autocomplete="username"><label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password"><button type="submit">Sign in</button></form></section></main></body></html>
